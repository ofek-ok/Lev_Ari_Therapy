<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1845" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lev Ari Therapy – Activity & Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Desktop Sidebar (Visible on Desktop >= 960px) -->
    <aside class="desktop-sidebar" aria-label="Sidebar Navigation">
      <div class="sidebar-brand">
        <div class="sidebar-logo-circle">
          <img src="assets/lev-ari-logo.png" alt="Lev Ari Therapy" />
        </div>
        <div class="sidebar-brand-text">
          <span class="eyebrow" data-i18n="brandEyebrow">טיפול קליני וספורטתרפיה</span>
          <h1 data-i18n="brandName">מכבי לב-ארי</h1>
          <p data-i18n="brandSubtitle">ניהול פעילות ותפעול</p>
        </div>
      </div>

      <nav class="sidebar-menu">
        <button type="button" class="nav-btn active" data-section="overview" onclick="window.app.navigate('overview')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
          <span data-i18n="navOverview">לוח בקרה ראשי</span>
        </button>

        <button type="button" class="nav-btn" data-section="tasks" onclick="window.app.navigate('tasks')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span data-i18n="navTasks">ניהול משימות</span>
          <span id="nav-badge-tasks" class="badge-pill">12</span>
        </button>

        <button type="button" class="nav-btn" data-section="schools" onclick="window.app.navigate('schools')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span data-i18n="navSchools">מוסדות לימוד</span>
          <span id="nav-badge-schools" class="badge-pill badge-orange">10</span>
        </button>

        <button type="button" class="nav-btn" data-section="athletic" onclick="window.app.navigate('athletic')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><path d="M7 21l3-6 2 2 3-5"/><path d="M5 12l4-2 4 2 4-3"/></svg>
          <span data-i18n="navAthletic">קבוצות ספורט</span>
          <span id="nav-badge-athletic" class="badge-pill">30</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="manager-badge-card">
          <div class="manager-logo-wrap">
            <img src="assets/okonski-logo.png" alt="Okonski Performance" />
          </div>
          <div class="manager-info">
            <span class="manager-tag" data-i18n="managedByLabel">ניהול פרויקט ופעילות</span>
            <strong>Okonski Performance</strong>
            <span class="manager-sub" data-i18n="managerRoleLabel">אופק – מנהל פעילות</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Mobile-First Viewport -->
    <div class="viewport-col">
      <!-- Sticky Mobile-First Top App Bar -->
      <header class="app-header">
        <div class="header-brand-row">
          <div class="mobile-logos-pill">
            <img src="assets/lev-ari-logo.png" alt="Lev Ari Therapy" class="hdr-lev-logo" />
            <span class="hdr-divider">×</span>
            <div class="hdr-okonski-box">
              <img src="assets/okonski-logo.png" alt="Okonski Performance" class="hdr-okonski-logo" />
            </div>
          </div>
          <div class="header-titles">
            <h2 id="page-heading" class="header-title">לוח בקרה ראשי</h2>
            <p id="page-subheading" class="header-subtitle">תמונת מצב מלאה: משימות, מוסדות וקבוצות ספורט</p>
          </div>
        </div>

        <div class="header-controls">
          <button type="button" class="sync-chip" onclick="window.app.openCloudModal()" title="Cloud Sync & Backup">
            <span class="pulse-dot"></span>
            <span class="sync-label" data-i18n="cloudSyncShort">ענן מוגן</span>
          </button>

          <div class="lang-toggle" role="group" aria-label="Language Switcher">
            <button type="button" id="lang-btn-he" class="lang-opt active" onclick="window.app.setLanguage('he')">עב</button>
            <button type="button" id="lang-btn-en" class="lang-opt" onclick="window.app.setLanguage('en')">EN</button>
          </div>
        </div>
      </header>

      <!-- Main Content Container -->
      <main id="main-content" class="app-main"></main>
    </div>

    <!-- Mobile Bottom Navigation Bar (Primary Navigation on Phones & Tablets) -->
    <nav class="bottom-nav" aria-label="Mobile Navigation">
      <button type="button" class="tab-btn active" data-section="overview" onclick="window.app.navigate('overview')">
        <div class="tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        </div>
        <span class="tab-label" data-i18n="mobileNavOverview">בקרה</span>
      </button>

      <button type="button" class="tab-btn" data-section="tasks" onclick="window.app.navigate('tasks')">
        <div class="tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span id="mobile-badge-tasks" class="tab-badge">12</span>
        </div>
        <span class="tab-label" data-i18n="mobileNavTasks">משימות</span>
      </button>

      <button type="button" class="tab-btn" data-section="schools" onclick="window.app.navigate('schools')">
        <div class="tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span id="mobile-badge-schools" class="tab-badge badge-orange">10</span>
        </div>
        <span class="tab-label" data-i18n="mobileNavSchools">מוסדות</span>
      </button>

      <button type="button" class="tab-btn" data-section="athletic" onclick="window.app.navigate('athletic')">
        <div class="tab-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="5" r="2"/><path d="M7 21l3-6 2 2 3-5"/><path d="M5 12l4-2 4 2 4-3"/></svg>
          <span id="mobile-badge-athletic" class="tab-badge">30</span>
        </div>
        <span class="tab-label" data-i18n="mobileNavAthletic">ספורט</span>
      </button>
    </nav>
  </div>

  <!-- Bottom-Sheet / Modal Dialog -->
  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="window.app.handleBackdropClick(event)">
    <div id="modal-dialog" class="modal-sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title"></h3>
        <button type="button" class="modal-close-btn" onclick="window.app.closeModal()" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
